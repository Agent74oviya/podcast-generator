name: "Podcast Generator"
author: "Ovindu Naleesha"
description: "Generates a feed for a podcast from a YAML file "
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email: 
    description: The committer's email address
    reuired: true
    defualt: ${{github.actor}}@localhost
  name:
    description: The committer's name
    required: true
    defualt: ${{github.actor}}
    